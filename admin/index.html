<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Painel do Corretor</title>
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="admin-login-body">

<div class="login-box">
  <!-- IMAGEM: logo -->
  <img src="../assets/images/logoo.png" alt="Logo" class="login-logo">
  <h1>Painel do corretor</h1>

  <form id="form-login">
    <input type="email" id="input-email" placeholder="E-mail" required>
    <input type="password" id="input-senha" placeholder="Senha" required>
    <p id="login-erro" class="login-erro"></p>
    <button type="submit" class="btn btn-primario">Entrar</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
