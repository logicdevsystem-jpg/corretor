<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo Imóvel - Painel do Corretor</title>
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

<header class="admin-header">
  <p class="admin-header-titulo">Painel do corretor</p>
  <button class="btn btn-sair" onclick="fazerLogout()">Sair</button>
</header>

<main class="admin-main">
  <a href="dashboard.html" class="link-voltar">&larr; Voltar</a>
  <h2 id="form-titulo">Novo imóvel</h2>

  <form id="form-imovel" class="form-imovel">

    <div class="form-secao">
      <p class="form-secao-titulo">Fotos</p>

      <label for="input-fotos" class="upload-label">
        Clique para escolher as fotos (pode escolher várias)
      </label>
      <input type="file" id="input-fotos" accept="image/*" multiple hidden>

      <div id="preview-fotos" class="preview-fotos"></div>
    </div>

    <div class="form-secao">
      <p class="form-secao-titulo">Informações do imóvel</p>

      <input type="text" id="input-titulo" placeholder="Título do imóvel" required>
      <input type="text" id="input-bairro" placeholder="Bairro / endereço" required>

      <div class="form-linha">
        <div class="input-com-prefixo">
          <span class="input-prefixo">R$</span>
          <input type="text" id="input-preco" inputmode="decimal" placeholder="0,00" required>
        </div>
        <select id="input-categoria" required>
          <option value="Apartamento">Apartamento</option>
          <option value="Casa">Casa</option>
          <option value="Terreno">Terreno</option>
          <option value="Comercial">Comercial</option>
        </select>
      </div>

      <input type="url" id="input-video" placeholder="Link do vídeo (YouTube) - opcional">
      <textarea id="input-descricao" placeholder="Descrição do imóvel"></textarea>
    </div>

    <div class="form-secao">
      <p class="form-secao-titulo">Status</p>

      <select id="input-status">
        <option value="disponivel">Disponível</option>
        <option value="vendido">Vendido</option>
      </select>

      <div id="grupo-vendido-ate" class="grupo-vendido-ate">
        <label for="input-vendido-ate">Ocultar da vitrine a partir de</label>
        <input type="date" id="input-vendido-ate">
        <p class="campo-ajuda">Deixe em branco para ocultar imediatamente ao marcar como vendido.</p>
      </div>
    </div>

    <p id="imovel-erro" class="login-erro"></p>

    <div class="form-botoes">
      <a href="dashboard.html" class="btn btn-cancelar">Cancelar</a>
      <button type="submit" class="btn btn-primario" id="btn-salvar">Salvar imóvel</button>
    </div>
  </form>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
